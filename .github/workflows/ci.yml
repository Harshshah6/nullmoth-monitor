name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1)"
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Bundle universal app
        run: make app-universal

      - name: Verify bundle
        run: |
          test -x "build/NullMoth Monitor.app/Contents/MacOS/NullMothMonitor"
          archs="$(lipo -archs "build/NullMoth Monitor.app/Contents/MacOS/NullMothMonitor")"
          echo "Architectures: $archs"
          echo "$archs" | grep -q x86_64
          echo "$archs" | grep -q arm64
          codesign --verify --deep --strict "build/NullMoth Monitor.app"

      - name: Archive app
        run: ditto -c -k --keepParent "build/NullMoth Monitor.app" "NullMothMonitor.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: NullMothMonitor
          path: NullMothMonitor.zip
          retention-days: 14
