name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Bundle app
        run: make app

      - name: Verify bundle
        run: |
          test -x "build/NullMoth Monitor.app/Contents/MacOS/NullMothMonitor"
          codesign --verify --deep --strict "build/NullMoth Monitor.app"

      - name: Archive app
        run: ditto -c -k --keepParent "build/NullMoth Monitor.app" "NullMothMonitor.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: NullMothMonitor
          path: NullMothMonitor.zip
          retention-days: 14
