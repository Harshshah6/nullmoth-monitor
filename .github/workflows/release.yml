name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1)"
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi

      - name: Show toolchain
        run: swift --version

      - name: Build universal app bundle
        run: make app-universal

      - name: Verify universal binary
        run: |
          archs="$(lipo -archs "build/NullMoth Monitor.app/Contents/MacOS/NullMothMonitor")"
          echo "Architectures: $archs"
          echo "$archs" | grep -q x86_64
          echo "$archs" | grep -q arm64

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" \
            "build/NullMoth Monitor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" \
            "build/NullMoth Monitor.app/Contents/Info.plist"
          codesign --force --sign - "build/NullMoth Monitor.app"

      - name: Package
        run: |
          ditto -c -k --keepParent "build/NullMoth Monitor.app" \
            "NullMothMonitor-${GITHUB_REF_NAME}.zip"
          cp ".build/universal/nullmoth-mon" "nullmoth-mon-${GITHUB_REF_NAME}"
          chmod +x "nullmoth-mon-${GITHUB_REF_NAME}"
          shasum -a 256 \
            "NullMothMonitor-${GITHUB_REF_NAME}.zip" \
            "nullmoth-mon-${GITHUB_REF_NAME}" \
            > "SHA256SUMS-${GITHUB_REF_NAME}.txt"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "NullMothMonitor-${GITHUB_REF_NAME}.zip" \
            "nullmoth-mon-${GITHUB_REF_NAME}" \
            "SHA256SUMS-${GITHUB_REF_NAME}.txt" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
